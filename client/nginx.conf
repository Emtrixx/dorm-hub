server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: forward /api/ to the server container over the compose
    # network. The trailing slash on proxy_pass strips the /api prefix, so the
    # Express app sees /news/all, not /api/news/all. Other request headers
    # (X-Forwarded-For etc. from the outer proxy) pass through untouched.
    location /api/ {
        proxy_pass http://server:8081/;
        proxy_set_header Host $host;
        # post image uploads go through here
        client_max_body_size 50m;
    }

    # hashed build assets can be cached hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links (/news/123, /admin, ...) must serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
