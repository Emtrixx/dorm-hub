name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # e2e doesn't run in CI yet; skip the Cypress binary download
  CYPRESS_INSTALL_BINARY: 0

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dorm-hub lint
      - run: pnpm --filter dorm-hub test:unit
      - run: pnpm --filter dorm-hub build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dorm-hub-api test
