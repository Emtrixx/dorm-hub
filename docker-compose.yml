services:
    client:
        image: vue-app
        build:
            context: .
            dockerfile: client/Dockerfile
        restart: unless-stopped
        ports:
            - 127.0.0.1:8082:80
        networks:
            - dormhub-app
        depends_on:
            - server
    server:
        image: dormhub-server
        build:
            context: .
            dockerfile: server/Dockerfile
        restart: unless-stopped
        ports:
            - 127.0.0.1:8081:8081
        environment:
            - DB_URL=mongodb://mongo:27017/dorm-hub
            # compose reads JWT_SECRET from a .env file next to this compose file
            - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in a .env file at the repo root}
        networks:
            - dormhub-app
        depends_on:
            - mongo
    mongo:
        image: mongo:8
        restart: unless-stopped
        networks:
            - dormhub-app
        volumes:
            - mongo-data:/data/db
    mongo-express:
        image: mongo-express
        restart: unless-stopped
        networks:
            - dormhub-app
        ports:
            - 127.0.0.1:8085:8081
        depends_on:
            - mongo
    # seeds:
    #     image: dormhub-seeds
    #     build:
    #         context: .
    #         dockerfile: server/DockerfileSeeds
    #     environment:
    #         - DB_URL=mongodb://mongo:27017/dorm-hub
    #     networks:
    #         - dormhub-app
    #     depends_on:
    #         - mongo
networks:
    dormhub-app:
        driver: bridge
volumes:
    mongo-data:
        driver: local
